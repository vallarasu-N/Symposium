<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful | TechnoVista</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="success-page">
        <div class="success-card">
            <div class="checkmark-circle">
                <i class="fas fa-check"></i>
            </div>
            <h1>Registration Successful!</h1>
            <p>Thank you, <strong>{{ name }}</strong> for registering for TechnoVista 2026.</p>
            <div class="registration-id-box">
                <span>Your Registration ID:</span>
                <strong class="reg-id">{{ registration_id }}</strong>
                <button onclick="copyID()" class="copy-btn"><i class="fas fa-copy"></i> Copy</button>
            </div>
            <p class="small">Please save this ID for future reference. An email confirmation has been sent.</p>
            <a href="/" class="home-btn">Back to Home</a>
        </div>
    </div>

    <script>
        function copyID() {
            const id = "{{ registration_id }}";
            navigator.clipboard.writeText(id);
            alert("Registration ID copied!");
        }
    </script>
</body>
</html>
